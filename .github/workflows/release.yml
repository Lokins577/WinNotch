name: Release

# Builds the WinNotch app + Inno Setup installer and attaches them to the GitHub
# Release. This guarantees every release carries a correctly-named "*-Setup.exe"
# asset, which the in-app updater (UpdateService) downloads to self-update.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and release, for example 0.6.3
        required: true
        type: string

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart('v', 'V')
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v', 'V')
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version could not be determined."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish application (self-contained single file)
        # Stamp the version from the tag so the built exe reports the released
        # version. This makes the git tag the single source of truth: the assembly
        # version (read by the in-app updater), the file version, and the installer
        # filename all come from the tag, with no manual csproj edits needed.
        run: >
          dotnet publish src/WinNotch/WinNotch.csproj -c Release -o publish
          -p:Version=${{ env.APP_VERSION }}
          -p:AssemblyVersion=${{ env.APP_VERSION }}.0
          -p:FileVersion=${{ env.APP_VERSION }}.0
          -p:InformationalVersion=${{ env.APP_VERSION }}

      - name: Validate signing configuration
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER)) {
            throw "MSIX_PUBLISHER secret is required and must match the signing certificate subject."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_ENDPOINT)) {
            throw "Azure Trusted Signing secrets are required for release artifacts."
          }

      - name: Sign published application
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer\WinNotch.iss

      - name: Build MSIX package
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          .\packaging\Build-Msix.ps1 `
            -PublishedDirectory .\publish `
            -OutputPath ".\publish\msix\WinNotch-$env:APP_VERSION-x64.msix" `
            -Version $env:APP_VERSION `
            -Publisher $env:MSIX_PUBLISHER

      - name: Sign Inno installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\publish\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign MSIX package
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\publish\msix
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            publish/installer/WinNotch-${{ env.APP_VERSION }}-Setup.exe
            publish/msix/WinNotch-${{ env.APP_VERSION }}-x64.msix
            publish/WinNotch.exe
